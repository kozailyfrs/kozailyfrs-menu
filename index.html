<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Menu</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #fdfdfd;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }

    a.button {
      padding: 40px 80px;
      background-color: #E20C88;
      color: white;
      text-decoration: none;
      border-radius: 16px;
      font-size: 48px;
    }

    a.button:hover {
      background-color: #E20C88;
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="button" href="KOZAILY DIGITAL MENU 2.pdf" target="_blank">Open Full Menu</a>
  </div>
</body>
</html>
